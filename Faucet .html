<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faucet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
    }

    nav {
      margin: 20px 0;
    }

    nav a {
      margin: 5px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #walletAddress {
      word-break: break-all;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🚰 Blockchain Faucet</h1>

  <nav>
    <a href="index.html">🏠 Home</a> |
    <a href="faucet.html">🚰 Faucet</a> |
    <a href="withdrawal.html">💸 Withdrawal</a> |
    <a href="exchange.html">🔄 Exchange</a>
  </nav>

  <div class="card">

    <h2>Claim Testnet Tokens</h2>

    <p>Network: Ethereum Sepolia Testnet</p>

    <button id="connectWallet">
      🔗 Connect Wallet
    </button>

    <p id="walletAddress">
      Wallet not connected
    </p>

    <hr>

    <button id="claimButton">
      🚰 Claim Testnet Reward
    </button>

    <p id="message"></p>

  </div>

<script>
  let connectedWallet = null;

  const SEPOLIA_CHAIN_ID = "0xaa36a7";

  const API_URL =
    "https://blockchain-faucet-api.adityagaonkar3456.workers.dev";


  async function connectWallet() {

    if (!window.ethereum) {
      document.getElementById("walletAddress").textContent =
        "Compatible Web3 wallet not detected.";
      return;
    }

    try {

      const accounts = await window.ethereum.request({
        method: "eth_requestAccounts"
      });

      connectedWallet = accounts[0];

      const chainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (chainId !== SEPOLIA_CHAIN_ID) {

        document.getElementById("walletAddress").textContent =
          "⚠️ Please switch to Ethereum Sepolia Testnet.";

        connectedWallet = null;
        return;
      }

      document.getElementById("walletAddress").textContent =
        "✅ Connected: " + connectedWallet;

    } catch (error) {

      document.getElementById("walletAddress").textContent =
        "Wallet connection cancelled.";
    }
  }


  async function claimFaucet() {

    const message = document.getElementById("message");

    if (!connectedWallet) {

      message.textContent =
        "⚠️ Please connect your wallet first.";

      return;
    }

    message.textContent =
      "⏳ Sending claim request...";

    try {

      const response = await fetch(
        API_URL + "/api/faucet/claim",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            wallet: connectedWallet
          })
        }
      );

      const data = await response.json();

      if (data.success) {

        message.textContent =
          "✅ " + data.message +
          " | Reward: " + data.reward +
          " | Status: " + data.status;

      } else {

        message.textContent =
          "❌ " + (data.error || "Claim failed.");
      }

    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Unable to connect to faucet API.";
    }
  }


  document.getElementById("connectWallet").onclick =
    connectWallet;

  document.getElementById("claimButton").onclick =
    claimFaucet;

</script>

</body>
  </html>
