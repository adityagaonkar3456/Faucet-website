
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faucet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
    }

    nav {
      margin: 20px 0;
    }

    nav a {
      margin: 5px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #walletAddress {
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>🚰 Blockchain Faucet</h1>

  <nav>
    <a href="index.html">🏠 Home</a> |
    <a href="faucet.html">🚰 Faucet</a> |
    <a href="withdrawal.html">💸 Withdrawal</a> |
    <a href="exchange.html">🔄 Exchange</a>
  </nav>

  <div class="card">

    <h2>Claim Testnet Tokens</h2>

    <p>Network: Ethereum Sepolia Testnet</p>

    <button id="connectWallet">
      🔗 Connect Wallet
    </button>

    <p id="walletAddress">
      Wallet not connected
    </p>

    <hr>

    <button id="claimButton">
      🚰 Claim Testnet Reward
    </button>

    <p id="message"></p>

  </div>

  
<script>
  let connectedWallet = null;

  const SEPOLIA_CHAIN_ID = "0xaa36a7";

  async function connectWallet() {

    if (!window.ethereum) {
      document.getElementById("walletAddress").textContent =
        "Compatible Web3 wallet not detected.";
      return;
    }

    try {

      const accounts = await window.ethereum.request({
        method: "eth_requestAccounts"
      });

      connectedWallet = accounts[0];

      const chainId = await window.ethereum.request({
        method: "eth_chainId"
      });

      if (chainId !== SEPOLIA_CHAIN_ID) {

        document.getElementById("walletAddress").textContent =
          "⚠️ Please switch to Ethereum Sepolia Testnet.";

        return;
      }

      document.getElementById("walletAddress").textContent =
        "✅ Connected: " + connectedWallet;

    } catch (error) {

      document.getElementById("walletAddress").textContent =
        "Wallet connection cancelled.";

    }
  }


  document.getElementById("connectWallet").onclick =
    connectWallet;


  document.getElementById("claimButton").onclick = function () {

    if (!connectedWallet) {

      document.getElementById("message").textContent =
        "Please connect your wallet first.";

      return;
    }

    document.getElementById("message").textContent =
      "Wallet verified on Sepolia. Faucet backend will be connected next.";

  };
</script>
</body>
</html>
