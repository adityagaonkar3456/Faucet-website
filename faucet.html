<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faucet</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f7fb;
    }

    nav {
      margin: 20px 0;
    }

    nav a {
      margin: 5px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>🚰 Blockchain Faucet</h1>

  <nav>
    <a href="index.html">🏠 Home</a> |
    <a href="faucet.html">🚰 Faucet</a> |
    <a href="withdrawal.html">💸 Withdrawal</a> |
    <a href="exchange.html">🔄 Exchange</a>
  </nav>

  <div class="card">

    <h2>Claim Testnet Tokens</h2>

    <p>Network: Ethereum Sepolia Testnet</p>

    <input
      id="walletAddress"
      type="text"
      placeholder="Enter Sepolia wallet address"
      autocomplete="off"
    >

    <br>

    <button id="claimButton">
      🚰 Claim Testnet Reward
    </button>

    <p id="message"></p>

  </div>

<script>

  const API_URL =
    "https://blockchain-faucet-api.adityagaonkar3456.workers.dev";

  const walletInput =
    document.getElementById("walletAddress");

  const message =
    document.getElementById("message");


  function isValidEthereumAddress(address) {

    return /^0x[a-fA-F0-9]{40}$/.test(address);

  }


  async function claimFaucet() {

    const wallet =
      walletInput.value.trim();

    if (!isValidEthereumAddress(wallet)) {

      message.textContent =
        "⚠️ Enter a valid Ethereum wallet address.";

      return;
    }

    message.textContent =
      "⏳ Sending claim request...";

    try {

      const response = await fetch(
        API_URL + "/api/faucet/claim",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            wallet: wallet
          })
        }
      );

      const data =
        await response.json();

      if (data.success) {

        message.textContent =
          "✅ " +
          data.message +
          " | Reward: " +
          data.reward +
          " | Status: " +
          data.status;

      } else {

        message.textContent =
          "❌ " +
          (data.error || "Claim failed.");

      }

        } catch (error) {

      console.error(error);

      message.textContent =
        "❌ " + error.name + ": " + error.message;

    }
  }


  document
    .getElementById("claimButton")
    .addEventListener("click", claimFaucet);

</script>

</body>
</html>
